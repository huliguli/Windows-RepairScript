name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Build (Release)
        shell: powershell
        run: ./build.ps1 -Release

      - name: Paket schnüren
        shell: powershell
        run: |
          $dist = "WindowsWartung"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item bin\WindowsWartung.exe $dist
          Copy-Item bin\*.dll $dist
          Copy-Item bin\ui $dist -Recurse
          Compress-Archive -Path "$dist\*" -DestinationPath WindowsWartung.zip -Force

      - name: Release-Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: WindowsWartung.zip
