name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Release-Beschreibung aus Changelog setzen
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          ./tools/release-notes.ps1 -Tag "$env:REL_TAG" -OutFile "release-notes.md"
          gh release edit "$env:REL_TAG" --notes-file "release-notes.md"

      - name: Build (Release)
        shell: powershell
        run: ./build.ps1 -Release

      - name: Signieren (optional, wenn Zertifikat hinterlegt)
        shell: powershell
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PW:  ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "Kein Signatur-Zertifikat hinterlegt - ueberspringe."; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          ./sign.ps1 -File bin\WindowsWartung.exe -Pfx cert.pfx -Password $env:PFX_PW
          Remove-Item cert.pfx -Force

      - name: Paket schnüren (ZIP)
        shell: powershell
        run: |
          $dist = "WindowsWartung"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item bin\WindowsWartung.exe $dist
          Copy-Item bin\*.dll $dist
          Copy-Item bin\ui $dist -Recurse
          Compress-Archive -Path "$dist\*" -DestinationPath WindowsWartung.zip -Force
          # SHA-256 fuer die Update-Pruefung der App
          (Get-FileHash WindowsWartung.zip -Algorithm SHA256).Hash | Set-Content -NoNewline WindowsWartung.zip.sha256

      - name: Installer bauen (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $ver = (Get-Item bin\WindowsWartung.exe).VersionInfo.FileVersion
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\WindowsWartung.iss

      - name: Release-Assets hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WindowsWartung.zip
            WindowsWartung.zip.sha256
            dist/WindowsWartung-Setup.exe
