name: Build and Release

# Ausgeloest durch das Pushen eines Tags "v*". Das Release wird ATOMAR
# veroeffentlicht: erst als Entwurf angelegt, dann alle Dateien (ZIP + SHA-256
# + Installer) angehaengt, erst danach sichtbar geschaltet. Die Update-Pruefung
# der App fragt releases/latest ab, das nie Entwuerfe liefert - sie kann also
# kein Release ohne Download-Paket mehr sehen. (Der alte Ablauf veroeffentlichte
# zuerst und haengte die Dateien ~5 Minuten spaeter an; ein Update-Klick in
# diesem Fenster lief ins Leere: "Kein Download-Paket im Release gefunden.")
#
# Release-Notes kommen wie bisher aus dem CHANGELOG.md-Abschnitt des Tags
# (tools/release-notes.ps1).
on:
  push:
    tags: ["v*"]
    # Auch jeder Push auf main baut und prueft (ohne Release): eine rote Probe faellt
    # so vor dem Tag auf, nicht erst beim Release-Lauf.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      # Der Bau nutzt den Roslyn-Compiler aus dem SDK (der eingebaute Framework-Compiler
      # kann nur C# 5). Version festgenagelt, damit ein Release reproduzierbar bleibt.
      - name: .NET SDK bereitstellen
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        shell: powershell
        run: ./build.ps1 -Release

      - name: Pruefungen (Sprache, Optik, Katalog)
        shell: powershell
        run: ./tests/run-tests.ps1

      # Schutz vor vergessenem Versions-Bump: die App vergleicht ihre eigene
      # AssemblyVersion (Assembly.GetName().Version, host\ShellForm.cs) mit dem Release-Tag;
      # passt beides nicht zusammen, wuerde der Updater dasselbe Update endlos wieder anbieten.
      # Geprueft werden BEIDE Werte aus src\AssemblyInfo.cs: die FileVersion (Explorer,
      # Installer) und die AssemblyVersion (Update-Pruefung). Bis 13.09.2026 zaehlte nur die
      # FileVersion; eine angehobene FileVersion mit vergessener AssemblyVersion ging gruen
      # durch und haette sich beim Kunden bei jedem Start selbst als Update angeboten.
      # Der Tag muss dreiteilig sein (v8.1.0): ein Tag v8.1 laege in ParseVer der App unter
      # 8.1.0.0, und Nutzer auf 8.1.0.0 bekaemen das Release nie angeboten.
      - name: Version pruefen (Tag == FileVersion == AssemblyVersion)
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $tag = "$env:GITHUB_REF_NAME"                                        # z. B. v8.1.0
          if (-not ($tag -match '^v(\d+)\.(\d+)\.(\d+)$')) {
            Write-Error "Tag '$tag' ist nicht dreiteilig (erwartet v<major>.<minor>.<patch>, z. B. v8.1.0)."
            exit 1
          }
          $erwartet = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $exe = (Resolve-Path bin\WindowsWartung.exe).Path
          $dateiText = (Get-Item $exe).VersionInfo.FileVersion                # AssemblyFileVersion, z. B. 8.1.0.0
          try { $datei = [version]$dateiText }
          catch { Write-Error "FileVersion '$dateiText' ist keine Versionsnummer (src\AssemblyInfo.cs)."; exit 1 }
          $asm = [Reflection.AssemblyName]::GetAssemblyName($exe).Version     # AssemblyVersion
          Write-Host "Tag $tag -> erwartet $erwartet; FileVersion $datei; AssemblyVersion $asm"
          if ($datei -ne $erwartet) {
            Write-Error "FileVersion ($datei) passt nicht zum Tag ($tag) - bitte AssemblyFileVersion in src\AssemblyInfo.cs anheben."
            exit 1
          }
          if ($asm -ne $erwartet) {
            Write-Error "AssemblyVersion ($asm) passt nicht zum Tag ($tag) - bitte AssemblyVersion in src\AssemblyInfo.cs anheben (die Update-Pruefung der App liest diesen Wert)."
            exit 1
          }
          Write-Host "Version ok: $erwartet (Tag $tag, FileVersion und AssemblyVersion stimmen)"

      - name: Programmdatei signieren
        shell: powershell
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PW:  ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "Kein Signatur-Zertifikat hinterlegt - ueberspringe."; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
          ./sign.ps1 -File bin\WindowsWartung.exe -Pfx cert.pfx -Password $env:PFX_PW
          # cert.pfx wird NICHT hier geloescht - der Installer wird gleich damit signiert.
          # Das Aufraeumen erledigt der eigene Schritt am Ende, der immer laeuft.
          #
          # Ohne diese Kontrolle war eine fehlgeschlagene Signatur unsichtbar: der Schritt
          # endete mit dem Erfolg des Aufraeumens und das Release ging unsigniert raus.
          $sig = Get-AuthenticodeSignature bin\WindowsWartung.exe
          Write-Host "Signaturstatus: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') { Write-Error "Signatur fehlt, obwohl ein Zertifikat hinterlegt ist."; exit 1 }
          # Die Herausgeber-Bindung der App haengt am Namen im Zertifikat. Aendert der sich
          # unbemerkt, lehnen alle installierten Fassungen jedes weitere Update ab.
          $erwartet = 'CN=Jonas (Windows-Wartung)'
          if ($sig.SignerCertificate.Subject -ne $erwartet) {
            Write-Error "Herausgeber weicht ab: '$($sig.SignerCertificate.Subject)' statt '$erwartet'. Installierte Fassungen wuerden dieses Update ablehnen."
            exit 1
          }

      # Die signierte EXE einmal so starten, wie sie beim Kunden startet. Die Tests (oben) laufen
      # VOR der Signatur und messen die Startpruefung nur unsigniert; danach startete bis
      # 13.09.2026 niemand die EXE. Der Bau-Server vertraut dem Stamm des Zertifikats nicht
      # (CERT_E_UNTRUSTEDROOT, 0x800B0109) - genau der Zweig, den jede Installation trifft
      # (host\Selbstpruefung.cs, IstKettenfehler). Aendert sich diese Liste, sign.ps1 oder das
      # Zertifikat, endet sonst jeder Kundenstart mit Exit 5 ("Programmdateien veraendert"),
      # waehrend die CI gruen bleibt. Ohne Zertifikat laeuft der Schritt unsigniert (Exit 0
      # verlangt, Tamper-Probe erwartet 6 statt 5).
      - name: Startpruefung der signierten EXE
        shell: powershell
        run: |
          $signiert = Test-Path cert.pfx
          $exe = (Resolve-Path bin\WindowsWartung.exe).Path
          $ausgabe = Join-Path $env:RUNNER_TEMP 'selbstpruefung.txt'
          function Selbstpruefung-Lauf([string]$was) {
            Remove-Item $ausgabe -Force -ErrorAction SilentlyContinue
            # Start-Process -Wait -PassThru und das Handle binden: die EXE ist eine Fensteranwendung,
            # ueber "& exe" kaeme kein ExitCode; ohne Zugriff auf Handle bleibt ExitCode leer.
            $p = Start-Process -FilePath $exe -ArgumentList @('--selbstpruefung', ('"' + $ausgabe + '"')) -Wait -PassThru
            $null = $p.Handle
            $text = ''
            if (Test-Path $ausgabe) { $text = [IO.File]::ReadAllText($ausgabe, [Text.Encoding]::UTF8) }
            Write-Host "--- Selbstpruefung ($was): Exit $($p.ExitCode) ---"
            Write-Host $text
            if ($text -eq '') { Write-Error "Startpruefung ($was) schrieb keine Ausgabedatei ($ausgabe)."; exit 1 }
            return New-Object PSObject -Property @{ Exit = $p.ExitCode; Text = $text }
          }
          $r = Selbstpruefung-Lauf 'unveraendert'
          if ($r.Exit -ne 0) { Write-Error "Startpruefung der signierten EXE endete mit Exit $($r.Exit) statt 0."; exit 1 }
          $verlangt = @('uiStimmt=true')
          if ($signiert) { $verlangt += @('signiert=true', 'signaturGueltig=true') }
          foreach ($zeile in $verlangt) {
            if ($r.Text -notmatch ('(?m)^' + [regex]::Escape($zeile) + '\s*$')) { Write-Error "Startpruefung: '$zeile' fehlt in der Ausgabe."; exit 1 }
          }
          # Tamper-Probe: app.js um ein Byte verlaengert muss zum Verweigern fuehren (5 signiert,
          # 6 unsigniert). Das Original kommt in jedem Fall zurueck, und der Hash beweist es -
          # sonst wanderte ein veraendertes app.js ins ZIP und in den Installer.
          $appJs = Join-Path (Split-Path -Parent $exe) 'ui\app.js'
          $sicherung = Join-Path $env:RUNNER_TEMP 'app.js.original'
          $hashVorher = (Get-FileHash $appJs -Algorithm SHA256).Hash
          Copy-Item $appJs $sicherung -Force
          $r2 = $null
          try {
            [IO.File]::AppendAllText($appJs, ' ', (New-Object System.Text.UTF8Encoding $false))
            $r2 = Selbstpruefung-Lauf 'app.js um ein Byte verlaengert'
          }
          finally {
            Copy-Item $sicherung $appJs -Force
            Remove-Item $sicherung, $ausgabe -Force -ErrorAction SilentlyContinue
          }
          $hashNachher = (Get-FileHash $appJs -Algorithm SHA256).Hash
          if ($hashNachher -ne $hashVorher) { Write-Error "app.js wurde nach der Tamper-Probe nicht wiederhergestellt (Hash $hashNachher statt $hashVorher)."; exit 1 }
          $erwartetExit = 6
          if ($signiert) { $erwartetExit = 5 }
          if ($r2.Exit -ne $erwartetExit) { Write-Error "Tamper-Probe: Exit $($r2.Exit) statt $erwartetExit (signiert=$signiert)."; exit 1 }
          if ($r2.Text -notmatch '(?m)^uiStimmt=false') { Write-Error "Tamper-Probe: Ausgabe ohne uiStimmt=false."; exit 1 }
          Write-Host "Startpruefung ok: unveraendert Exit 0, veraendert Exit $erwartetExit, app.js wiederhergestellt (signiert=$signiert)."

      - name: Paket schnüren (ZIP)
        shell: powershell
        run: |
          $dist = "WindowsWartung"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item bin\WindowsWartung.exe $dist
          Copy-Item bin\*.dll $dist
          Copy-Item bin\ui $dist -Recurse
          Compress-Archive -Path "$dist\*" -DestinationPath WindowsWartung.zip -Force
          # SHA-256 fuer die Update-Pruefung der App
          (Get-FileHash WindowsWartung.zip -Algorithm SHA256).Hash | Set-Content -NoNewline WindowsWartung.zip.sha256

      - name: Installer bauen (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $ver = (Get-Item bin\WindowsWartung.exe).VersionInfo.FileVersion
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\WindowsWartung.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup meldete ExitCode $LASTEXITCODE"; exit 1 }

      # Der Installer ist der empfohlene Weg fuer Endnutzer - er wird deshalb ebenfalls
      # signiert, und zwar NACH dem Bauen (Inno erzeugt die Datei erst hier).
      - name: Installer signieren
        shell: powershell
        run: |
          if (-not (Test-Path cert.pfx)) { Write-Host "Kein Zertifikat - ueberspringe."; exit 0 }
          ./sign.ps1 -File dist\WindowsWartung-Setup.exe -Pfx cert.pfx -Password $env:PFX_PW
          $sig = Get-AuthenticodeSignature dist\WindowsWartung-Setup.exe
          Write-Host "Installer-Signatur: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') { Write-Error "Installer blieb unsigniert."; exit 1 }
        env:
          PFX_PW: ${{ secrets.CODESIGN_PASSWORD }}

      # Erst jetzt die Pruefsumme: sie muss die SIGNIERTE Datei beschreiben.
      - name: Pruefsumme des Installers
        shell: powershell
        run: |
          (Get-FileHash dist\WindowsWartung-Setup.exe -Algorithm SHA256).Hash |
            Set-Content -NoNewline dist\WindowsWartung-Setup.exe.sha256

      - name: Zertifikat vom Bau-Server entfernen
        if: always()
        shell: powershell
        run: Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue

      - name: Build-Artefakt hochladen (manuelle Läufe)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: WindowsWartung
          path: |
            WindowsWartung.zip
            WindowsWartung.zip.sha256
            dist/WindowsWartung-Setup.exe

      # Erst Entwurf + alle Dateien, dann veroeffentlichen: die Update-Pruefung
      # kann nie ein halbfertiges Release sehen.
      - name: Release veröffentlichen (Entwurf → Assets → sichtbar)
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $assets = @("WindowsWartung.zip", "WindowsWartung.zip.sha256",
                      "dist\WindowsWartung-Setup.exe", "dist\WindowsWartung-Setup.exe.sha256")
          foreach ($f in $assets) {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { Write-Error "Asset fehlt oder ist leer: $f"; exit 1 }
          }
          # Ein abgebrochener Lauf hinterlaesst einen Entwurf; ohne Aufraeumen scheitert
          # der Neustart des Workflows an "release already exists".
          #
          # WICHTIG: GitHub setzt in PowerShell-Schritten ErrorActionPreference=Stop.
          # "gh release view" schreibt bei fehlendem Release "release not found" auf
          # stderr, und das beendet den Schritt sofort - obwohl genau dieser Fall der
          # Normalzustand ist. Deshalb die Abfrage in Continue kapseln und nur den
          # ExitCode auswerten.
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap
          if ($exists) {
            Write-Host "Vorhandenes Release/Entwurf $tag wird entfernt (Wiederholungslauf)."
            gh release delete $tag --yes --cleanup-tag=false
            if ($LASTEXITCODE -ne 0) { Write-Error "Aufraeumen fehlgeschlagen."; exit 1 }
          }
          ./tools/release-notes.ps1 -Tag $tag -OutFile "release-notes.md"
          gh release create $tag --draft --title "Windows-Wartung $tag" --notes-file "release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Jede Datei einzeln anhaengen: eindeutiger als Array-Splatting und der
          # Fehlschlag laesst sich der konkreten Datei zuordnen.
          foreach ($f in $assets) {
            gh release upload $tag $f
            if ($LASTEXITCODE -ne 0) { Write-Error "Anhaengen fehlgeschlagen: $f"; exit 1 }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Release $tag veroeffentlicht (alle Dateien angehaengt)."
